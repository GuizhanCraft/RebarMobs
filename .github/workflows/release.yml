name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.BOT_TOKEN || github.token }}

      - name: Calculate next version
        id: version
        run: bash .github/scripts/next-version.sh

      - name: Ensure release tag does not already exist
        if: steps.version.outputs.should_release == 'true'
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Error: Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

  build-and-release:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      mc_version: ${{ steps.read_versions.outputs.mc_version }}
      rebar_version: ${{ steps.read_versions.outputs.rebar_version }}
      pylon_version: ${{ steps.read_versions.outputs.pylon_version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        run: |
          echo "version=${{ needs.check-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ needs.check-version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${{ needs.check-version.outputs.version }}"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          REPO_URL="https://github.com/${{ github.repository }}"
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- [%h](${REPO_URL}/commit/%H) %s" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- [%h](${REPO_URL}/commit/%H) %s" "${PREVIOUS_TAG}..HEAD")
          fi
          CHANGELOG_ESCAPED=$(echo "$CHANGELOG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))' || echo '""')
          echo "changelog=$CHANGELOG_ESCAPED" >> "$GITHUB_OUTPUT"
          echo "Changelog:"
          echo "$CHANGELOG"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply code formatting
        env:
          BOT_NAME: ${{ vars.BOT_NAME || 'github-actions[bot]' }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}
        run: |
          ./gradlew spotlessApply
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "$BOT_NAME"
            git config user.email "$BOT_EMAIL"
            git add -A
            git commit -m "chore: spotless apply"
            git push
          fi

      - name: Read versions from gradle.properties
        id: read_versions
        run: |
          MC_VERSION=$(grep "^minecraft.version=" gradle.properties | cut -d'=' -f2)
          if [ -z "$MC_VERSION" ]; then
            echo "Error: Failed to read minecraft.version from gradle.properties"
            exit 1
          fi
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Minecraft version: $MC_VERSION"

          REBAR_VERSION=$(grep "^rebar.version=" gradle.properties | cut -d'=' -f2)
          if [ -z "$REBAR_VERSION" ]; then
            echo "Error: Failed to read rebar.version from gradle.properties"
            exit 1
          fi
          echo "rebar_version=$REBAR_VERSION" >> "$GITHUB_OUTPUT"
          echo "Rebar version: $REBAR_VERSION"

          PYLON_VERSION=$(grep "^pylon.version=" gradle.properties | cut -d'=' -f2)
          if [ -z "$PYLON_VERSION" ]; then
            echo "Error: Failed to read pylon.version from gradle.properties"
            exit 1
          fi
          echo "pylon_version=$PYLON_VERSION" >> "$GITHUB_OUTPUT"
          echo "Pylon version: $PYLON_VERSION"

      - name: Build with Gradle
        run: ./gradlew spotlessCheck clean test shadowJar -Pplugin.version="${{ steps.version.outputs.version }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: RebarMobs-${{ steps.version.outputs.version }}
          path: build/libs/*.jar

  deploy-gr:
    runs-on: ubuntu-latest
    needs: build-and-release
    if: needs.build-and-release.result == 'success'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: RebarMobs-${{ needs.build-and-release.outputs.version }}
          path: staging

      - name: Get filename
        id: filename
        run: |
          JAR_PATH=$(find staging -maxdepth 1 -type f -name 'RebarMobs-*.jar' | sort | head -n 1)
          FILENAME=$(basename "$JAR_PATH")
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "Jar: $FILENAME"

      - name: Create JSON Payload
        run: |
          CHANGELOG=$(cat <<'CHANGELOG'
          ${{ needs.build-and-release.outputs.changelog }}
          CHANGELOG
          )
          REBAR_VERSION="${{ needs.build-and-release.outputs.rebar_version }}"
          PYLON_VERSION="${{ needs.build-and-release.outputs.pylon_version }}"

          # Build dependencies array
          DEPS="[{\"type\":\"required\",\"name\":\"Rebar ${REBAR_VERSION}\"},{\"type\":\"optional\",\"name\":\"Pylon ${PYLON_VERSION}\"}]"

          cat <<EOF > payload.json
          {
            "version": "${{ needs.build-and-release.outputs.version }}",
            "name": "v${{ needs.build-and-release.outputs.version }}",
            "channel": "dev",
            "changelog": ${CHANGELOG},
            "minecraft_versions": ["${{ needs.build-and-release.outputs.mc_version }}"],
            "dependencies": ${DEPS},
            "files": ["${{ steps.filename.outputs.filename }}"]
          }
          EOF

      - name: Upload to Guizhan Resources
        run: |
          HTTP_RESPONSE=$(curl -w "\n%{http_code}" -X POST "${{ vars.GUIZHAN_RESOURCES_BASE_URL }}/api/v1/projects/${{ vars.GUIZHAN_RESOURCES_PROJECT_ID }}/versions" \
            -H "Authorization: Bearer ${{ secrets.GUIZHAN_RESOURCES_TOKEN }}" \
            -F "data=$(cat payload.json)" \
            -F "${{ steps.filename.outputs.filename }}=@${{ steps.filename.outputs.jar_path }};type=application/java-archive")
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          echo "Response: $RESPONSE_BODY"
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Error: Upload failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Upload successful!"
        env:
          GUIZHAN_RESOURCES_TOKEN: ${{ secrets.GUIZHAN_RESOURCES_TOKEN }}

  create-tag:
    runs-on: ubuntu-latest
    needs: [check-version, build-and-release, deploy-gr]
    if: |
      needs.check-version.result == 'success' &&
      needs.check-version.outputs.should_release == 'true' &&
      needs.build-and-release.result == 'success' &&
      needs.deploy-gr.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.BOT_TOKEN || github.token }}

      - name: Create git tag
        env:
          BOT_NAME: ${{ vars.BOT_NAME || 'github-actions[bot]' }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git tag -a "${{ needs.check-version.outputs.tag }}" -m "${{ needs.check-version.outputs.tag }}"
          git push "https://x-access-token:${BOT_TOKEN}@github.com/${{ github.repository }}" "${{ needs.check-version.outputs.tag }}"
