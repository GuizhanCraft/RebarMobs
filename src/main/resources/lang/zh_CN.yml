addon: "Rebar 生物"
item:
  soul_shard:
    name: "灵魂碎片"
    lore: |-
      <arrow> 一块破碎的晶体，搏动着捕获而来的生物精华。

      <guidearrow> 主手手持该物品并<insn>潜行 + 右键</insn>
      <guidearrow> 以重置生物类型与灵魂数量。

      <arrow> <attr>生物类型:</attr> %mob-type%
      <arrow> <attr>等级:</attr> %tier%
      <arrow> <attr>灵魂数:</attr> %souls%
    no-mob-type: "<red>未绑定"
  corrupted_essence:
    name: "腐化精华"
  vile_dust:
    name: "邪恶之尘"
  corrupted_ingot:
    name: "腐化锭"
  vile_sword_frame:
    name: "邪恶之剑框架"
  soul_altar:
    name: "灵魂祭坛"
    lore: |-
      <star> 多方块结构
      <arrow> 一个古老的祭坛，低语着转变。
      <arrow> 手持材料物品<insn>右键点击</insn>以使用。
      <arrow> <red>整个多方块结构将被摧毁。</red>

      <u>组成部分</u>
      <diamond> 1x <yellow><item:rebarmobs:soul_altar/></yellow>
      <diamond> 4x <yellow><item:quartz_block/></yellow>
      <diamond> 4x <yellow><item:obsidian/></yellow>
  soul_cage:
    name: "灵魂笼子"
    lore: |-
      <arrow> 一座由腐化金属锻造的牢笼，贪婪地渴求灵魂。
      <arrow> 它扭曲了生与死之间的界限。

      <guidearrow> 使用<item:rebarmobs:soul_shard><insn>右键点击</insn>以激活。
      <guidearrow> <insn>潜行 + 右键点击</insn>以收回<item:rebarmobs:soul_shard>并取消激活。
    waila:
      empty: "灵魂笼子 | <red>空"
      filled: "灵魂笼子 | %mob-type% | 等级 %tier%"
  cursed_fire:
    name: "诅咒之火"
  quartz_and_steel:
    name: "石英打火石"
  mob_lasso:
    status:
      empty: "<red>空"
      filled: "<green>已捕获%entity-type%"
    escape-after:
      never: "<yellow>从不"
      ticks: "%ticks% 刻 (%seconds% 秒)"
    capture:
      not-empty: "<red>无法捕捉：该生物套索已捕获%entity-type%。"
      wrong-type: "<red>该生物套索无法捕获%entity-type%。"
      too-strong: "<red>无法捕捉：目标生命值过高，请先降低其生命值。"
      soul-cage-spawned: "<red>无法捕捉由灵魂笼子生成的生物。"
      error: "<red>捕捉过程中发生错误。"
    release:
      invalid-block-type: "<red>无法在该位置释放捕获的生物。"
      error: "<red>释放过程中发生错误。"
  aqua_lasso:
    name: "水生套索"
    lore: |-
      <arrow> 用于捕捉水生和两栖生物的套索。

      <arrow> <attr>状态:</attr> %status%
      <arrow> <attr>逃跑时间:</attr> %escape-after%
  golden_lasso:
    name: "金制套索"
    lore: |-
      <arrow> 适合捕捉大部分陆地动物的金制套索。

      <arrow> <attr>状态:</attr> %status%
      <arrow> <attr>逃跑时间:</attr> %escape-after%
  diamond_lasso:
    name: "钻石套索"
    lore: |-
      <arrow> 适合捕捉大部分陆地动物的加固套索。

      <arrow> <attr>状态:</attr> %status%
      <arrow> <attr>逃跑时间:</attr> %escape-after%
  hostile_lasso:
    name: "敌对套索"
    lore: |-
      <arrow> 可用于捕捉虚弱的敌对生物。

      <arrow> <attr>状态:</attr> %status%
      <arrow> <attr>逃跑时间:</attr> %escape-after%
  creative_lasso:
    name: "<#ff00ff>创造套索"
    lore: |-
      <arrow> 几乎可用于所有生物的套索。

      <arrow> <attr>状态:</attr> %status%
      <arrow> <attr>逃跑时间:</attr> %escape-after%
  vile_sword:
    name: "邪恶之剑"
    lore: |-
      <arrow> 主手手持该剑击杀
      <arrow> 可额外获得一个灵魂。
  mob_head_info:
    name: "击杀生物"
    lore: |-
      <arrow> 击杀指定的生物有几率掉落其头颅。
      <arrow> 斩首者附魔可额外增加几率。

      <arrow> <attr>基础几率:</attr> %base-chance%
      <arrow> <attr>斩首者几率:</attr> 每级%decapitator-chance%
