addon: "Rebar Mobs"

item:
  soul_shard:
    name: "Soul Shard"
    lore: |-
      <arrow> A fractured crystal, pulsing with captured essence.

      <guidearrow> <insn>Sneak + Right click</insn> while holding in
      <guidearrow> main hand to reset type and soul amount.

      <arrow> <attr>Mob Type:</attr> %mob-type%
      <arrow> <attr>Tier:</attr> %tier%
      <arrow> <attr>Souls:</attr> %souls%
    no-mob-type: "<red>Not Bound"
  corrupted_essence:
    name: "Corrupted Essence"
  vile_dust:
    name: "Vile Dust"
  corrupted_ingot:
    name: "Corrupted Ingot"
  vile_sword_frame:
    name: "Vile Sword Frame"
  soul_altar:
    name: "Soul Altar"
    lore: |-
      <star> Multiblock
      <arrow> An ancient altar that whispers of transformation.
      <arrow> <insn>Right click</insn> with ingredient item in hand.
      <arrow> <red>The whole multiblock will be destroyed.</red>

      <u>Components</u>
      <diamond> 1x <yellow><item:rebarmobs:soul_altar/></yellow>
      <diamond> 4x <yellow><item:quartz_block/></yellow>
      <diamond> 4x <yellow><item:obsidian/></yellow>
  soul_cage:
    name: "Soul Cage"
    lore: |-
      <arrow> A cage forged from corrupted metal, hungry for souls.
      <arrow> It bends the boundary between life and death.

      <guidearrow> <insn>Right click</insn> with <item:rebarmobs:soul_shard> to activate.
      <guidearrow> <insn>Sneak + Right click</insn> to get <item:rebarmobs:soul_shard> back and deactivate.
    waila:
      empty: "Soul Cage | <red>Empty"
      filled: "Soul Cage | %mob-type% | Tier %tier%"
  cursed_fire:
    name: "Cursed Fire"
  quartz_and_steel:
    name: "Quartz and Steel"
  mob_lasso:
    status:
      empty: "<red>Empty"
      filled: "<green>Holding %entity-type%"
    escape-after:
      never: "<yellow>Never"
      ticks: "%ticks% ticks (%seconds% seconds)"
    capture:
      not-empty: "<red>Cannot capture: this lasso is already holding %entity-type%."
      wrong-type: "<red>This lasso cannot capture %entity-type%."
      too-strong: "<red>Cannot capture: the target is too strong. Weaken it first."
      soul-cage-spawned: "<red>Cannot capture mobs spawned by Soul Cage."
      error: "<red>An error has occurred while capturing."
    release:
      invalid-block-type: "<red>The captured mob cannot be released at that location."
      error: "<red>An error has occurred while releasing."
  aqua_lasso:
    name: "Aqua Lasso"
    lore: |-
      <arrow> A lasso designed for aquatic and amphibious mobs.

      <arrow> <attr>Status:</attr> %status%
      <arrow> <attr>Escape after:</attr> %escape-after%
  golden_lasso:
    name: "Golden Lasso"
    lore: |-
      <arrow> A golden lasso for most land animals.

      <arrow> <attr>Status:</attr> %status%
      <arrow> <attr>Escape after:</attr> %escape-after%
  diamond_lasso:
    name: "Diamond Lasso"
    lore: |-
      <arrow> A reinforced lasso for most land animals.

      <arrow> <attr>Status:</attr> %status%
      <arrow> <attr>Escape after:</attr> %escape-after%
  hostile_lasso:
    name: "Hostile Lasso"
    lore: |-
      <arrow> A dangerous lasso for weakened hostile mobs.

      <arrow> <attr>Status:</attr> %status%
      <arrow> <attr>Escape after:</attr> %escape-after%
  creative_lasso:
    name: "<#ff00ff>Creative Lasso"
    lore: |-
      <arrow> A lasso for almost every mob.

      <arrow> <attr>Status:</attr> %status%
      <arrow> <attr>Escape after:</attr> %escape-after%
  vile_sword:
    name: "Vile Sword"
    lore: |-
      <arrow> Gain 1 extra soul when killing
      <arrow> with this sword in main hand.
  mob_head_info:
    name: "Killing an entity"
    lore: |-
      <arrow> Killing an specified entity has chance to drop its head.
      <arrow> Decapitator enchantment can increase chance.

      <arrow> <attr>Base chance:</attr> %base-chance%
      <arrow> <attr>Decapitator chance:</attr> %decapitator-chance% per level
