# Auto update from Guizhan Resources
auto-update:
  # Default: true
  enabled: true

  # Update check interval in days
  # The update check will only run if the days since last check exceeds this value
  # Set to 0 or negative values to check on every startup
  # Default: 1
  interval-days: 1

  # Whether to download the new version.
  # Disabling will only notify in console and every op.
  download: true

# Mob Heads config
# Only applies to the mob heads added by this addon.
#
## Chance Calculation
# All the chances will be added.
# For example, base chance = 0.15, level 3 decapitator chance = 0.1 * 3,
# the final chance would be 0.15+0.1*3=0.45
mob-heads:
  # The base chance of getting mob head when killing an entity.
  base-chance: 0.01

  # The chance increased by each level of Decapitator enchantment.
  decapitator-chance: 0.02

  # Override settings for certain mobs. Invalid entity types are ignored.
  # Structure follows above
  overrides:
    chicken:
      base-chance: 0.01
      decapitator-chance: 0.02

# Shared Mob Lasso config
mob-lasso:
  # Ambient is triggered when player holds a mob lasso in their main hand and the lasso is holding a mob.
  ambient:
    enabled: true

    # The interval will be multiplied by `inventory-ticker-base-rate` setting in rebar, which defaults to 10.
    # So, by default, players will hear ambient every 60*10 Minecraft ticks, which is 30 seconds.
    interval: 60

  # When enabled, renaming a lasso with an anvil will set the released mob's custom name.
  # If the lasso is not renamed, the mob's original custom name (if any) will be restored.
  rename:
    enabled: false
